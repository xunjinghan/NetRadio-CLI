name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 语法检查
        run: node --check radio.mjs

      - name: --help 冒烟
        run: node radio.mjs --help

  encoding-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 所有文本文件必须是合法 UTF-8
        run: |
          python3 - <<'PY'
          import pathlib, sys
          exts = {'.md', '.py', '.json', '.txt', '.yml', '.yaml', '.js', '.mjs', '.cmd', '.sh', '.toml'}
          bad = []
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts:
                  continue
              try:
                  p.read_bytes().decode('utf-8')
              except UnicodeDecodeError:
                  bad.append(str(p))
          print('非 UTF-8 文件:', bad if bad else '无')
          sys.exit(1 if bad else 0)
          PY
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 凭据扫描
        run: |
          set -e
          PATTERNS='github_pat_|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{32,}|AIza[A-Za-z0-9_-]{30,}'
          if grep -rInE "$PATTERNS" --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::发现疑似凭据"
            exit 1
          fi
          echo "OK"
